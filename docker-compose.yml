services:
  postgres:
    image: postgres:16-alpine
    container_name: usuarios-postgres
    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: usuarios
      POSTGRES_PASSWORD: usuarios123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuarios -d usuarios_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: usuarios-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      API_KEY: changeme-123
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/usuarios_db
      SPRING_DATASOURCE_USERNAME: usuarios
      SPRING_DATASOURCE_PASSWORD: usuarios123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  postgres_data:
